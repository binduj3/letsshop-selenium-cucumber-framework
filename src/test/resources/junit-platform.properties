# ---------------------------------------------------------------
# Cucumber settings. Read automatically by JUnit on every run.
# Any line here can be overridden from the command line with -D
#   e.g. mvn test -Dcucumber.filter.tags="@smoke"
# ---------------------------------------------------------------

# Reports: console output + an HTML report (screenshots appear here)
cucumber.plugin=pretty, html:target/cucumber-report.html

# Hide Cucumber's "share your report online" banner
cucumber.publish.quiet=true

# Run only scenarios with these tags (empty = run everything)
#cucumber.filter.tags=@e2e

#cucumber.execution.dry-run=true

cucumber.snippet-type=camelcase